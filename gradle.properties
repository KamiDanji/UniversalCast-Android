org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.configuration-cache=true

# Single version for both apps. The GitHub release tag must be v<uc.versionName>; bump uc.versionCode on every release.
uc.versionName=1.2.2
uc.versionCode=16

# AGP 9: keep the explicit Kotlin Android plugin / legacy DSL (migrate to built-in Kotlin later).
android.builtInKotlin=false
android.newDsl=false
